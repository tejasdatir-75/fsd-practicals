<!DOCTYPE html>
<html>
<head>
    <title>Product</title>
</head>
<body>

<h2>Multiply Two Numbers</h2>

<form method="POST">

    <input type="number" name="a" placeholder="First Number"
           value="{{ a }}">
    <br><br>

    <input type="number" name="b" placeholder="Second Number"
           value="{{ b }}">
    <br><br>

    <input type="submit" value="Multiply">

</form>

<h3>Product = {{ result }}</h3>

</body>
</html>
