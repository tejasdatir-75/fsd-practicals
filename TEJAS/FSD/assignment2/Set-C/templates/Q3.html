<!DOCTYPE html>
<html>
<head>
    <title>Library Search</title>
</head>
<body>
    <h2>Library Search System</h2>

    <form method="POST">
        Enter Book Name:
        <input type="text" name="book" required>
        <br><br>

        <input type="submit" value="Search">
    </form>

    {% if result %}
        <h3>{{ result }}</h3>
    {% endif %}
</body>
</html>
