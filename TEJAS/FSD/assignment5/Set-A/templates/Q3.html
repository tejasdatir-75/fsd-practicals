<!DOCTYPE html>
<html>
<head>
    <title>Area of Rectangle</title>
</head>
<body>
    <h2>Area of Rectangle</h2>

    <form method="POST">
        Length:
        <input type="number" name="length" step="any" required>
        <br><br>

        Breadth:
        <input type="number" name="breadth" step="any" required>
        <br><br>

        <input type="submit" value="Calculate Area">
    </form>

    <h3>Area: {{ result }}</h3>
</body>
</html>
